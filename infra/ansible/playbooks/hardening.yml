- name: Base hardening
  hosts: windhelm
  become: true

  vars:
    admin_user: rafael
    admin_key: "~/.ssh/windhelm_rafael.pub"
    deploy_user: deploy
    deploy_key: "~/.ssh/windhelm_deploy.pub"
    admin_ips: "{{ lookup('env', 'TF_VAR_admin_ips') | default('[]', true) | from_json }}"

  tasks:
    - name: Create admin user
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: sudo
        append: true
        shell: /bin/bash

    - name: Authorize admin key
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ lookup('file', admin_key) }}"
        exclusive: true

    - name: Authorize deploy key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ lookup('file', deploy_key) }}"
        exclusive: true

    - name: Allow passwordless sudo for deploy user
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-deploy
        content: "{{ deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Harden sshd
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AllowUsers {{ admin_user }} {{ deploy_user }}
          X11Forwarding no
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Restart sshd

    - name: Install unattended-upgrades and fail2ban
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - fail2ban
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Configure fail2ban for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        content: |
          [sshd]
          enabled = true
          backend = systemd
          maxretry = 5
          bantime = 1h
          ignoreip = 127.0.0.1/8 ::1 {{ admin_ips | join(' ') }}
        mode: "0644"
      notify: Restart fail2ban

    - name: Ensure services are enabled and running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - fail2ban
        - unattended-upgrades

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted